# Netlify Configuration for React Vite Frontend (in /frontend folder)

[build]
  # Base directory - where npm install runs from
  base = "frontend"
  # Build command (runs from frontend directory)
  command = "npm run build"
  # Directory to deploy (relative to base)
  publish = "dist"

# Environment variables
[build.environment]
  NODE_ENV = "production"

# API proxy configuration
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.com/api/:splat"
  status = 200
  force = true

# Fallback route for SPA (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
